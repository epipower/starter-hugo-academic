```html
<div id="test-popup" style="
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 999999;
  background: red;
  color: white;
  padding: 30px;
  font-size: 30px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
">
  <button id="test-popup-close" style="
    position: absolute;
    top: 5px;
    right: 8px;
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
  " aria-label="Popup schließen">
    ×
  </button>

  <img src="/uploads/test.jpeg" alt="Test" style="width: 200px; display: block;">

  TEST BODY-END
</div>

<script>
  (function () {
    const popup = document.getElementById('test-popup');
    const closeButton = document.getElementById('test-popup-close');

    // Wurde das Popup in dieser Browser-Session bereits angezeigt?
    if (sessionStorage.getItem('testPopupShown') === 'true') {
      popup.style.display = 'none';
      return;
    }

    // Popup als angezeigt markieren
    sessionStorage.setItem('testPopupShown', 'true');

    // Popup schließen
    closeButton.addEventListener('click', function () {
      popup.style.display = 'none';
    });
  })();
</script>
```
