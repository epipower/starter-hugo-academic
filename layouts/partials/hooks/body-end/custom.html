<div id="welcome-popup" style="
  position: fixed;
  inset: 0;
  z-index: 999999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.7);
">

  <div style="
    position: relative;
    background: white;
    padding: 30px;
    max-width: 500px;
    text-align: center;
  ">

    <button
      type="button"
      onclick="closeWelcomePopup()"
      style="
        position: absolute;
        top: 5px;
        right: 10px;
        font-size: 25px;
      ">
      &times;
    </button>

    <img
      src="/uploads/test.jpeg"
      alt="Willkommen"
      style="
        display: block;
        width: 100%;
        max-width: 400px;
        height: auto;
        margin: 0 auto 20px;
      ">

    <h2>Willkommen!</h2>

    <p>Hier kommt dein Text hin.</p>

    <button
      type="button"
      onclick="closeWelcomePopup()">
      Schließen
    </button>

  </div>
</div>
